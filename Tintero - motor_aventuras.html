const SYN = `COMANDOS:
  Palabras exactas · alternativas con | (ej: di * | decir *) · * = cualquier texto tras la palabra.
  En reglas «Verbo + objetos»: $1 y $2 = id de los objetos del comando, $n1 y $n2 = sus nombres.
  Varias reglas con el mismo comando: se ejecuta la primera cuyas condiciones se cumplan.

CONDICIONES (todas deben cumplirse; "!" delante la niega):
  flag:nombre · tiene:objeto · aqui:objeto · sala:habitación · zona:habitación (si tienes varias habitaciones con el mismo nombre exacto se activara la condición en cualquiera de ellos)
  abierto:contenedor · en:objeto > habitación es: objeto1 > objeto2 (compara si dos referencias u objetos son exactamente el mismo elemento)
  pnj:nombre > sala (sin > sala: sigue en la aventura) · pnjtiene:nombre > objeto
  var: nombre >= 3 · timer: nombre (en marcha) · timer: nombre <= 2
  turnos: >= 10 · puntos: >= 5   (operadores: >= <= > < =)
  
SUBCONDICIONES PARALELAS (enlace línea a línea con Efectos):
  si: condición (evalúa cada línea de Condición con su correspondiente línea de Efecto)

EFECTOS:
  di: texto · activar: bandera · desactivar: bandera · mirar: sala · mirar: <objeto> (devuelve la descripción de la sala u objeto actual; usa la descripción alternativa si su condición se cumple. Debes escribir exactamente "sala" luego de los dos puntos si es un objeto escribe un nombre o $1).
  entonces: efecto (ejecuta este efecto si su correspondiente línea "si:" se cumplió)
  dar: objeto · quitar: objeto · mover: objeto > habitación (o > inventario, o > contenedor)
  abrir: habitación > dirección · cerrar: habitación > dirección
  pnj: nombre > habitación (o > fuera) · pnjdar: nombre > objeto · pnjtomar: nombre > objeto (de su sala)
  pnjsoltar: nombre [> objeto] · pnjentregar: nombre > objeto (al jugador) · pnjruta: nombre > on|off
  manual: (abre el manual) · manual: capítulo (abre ese capítulo)
  ir: habitación · luz: habitación > on|off|partial
  dañar: n · curar: n · fin: texto
  fijar: variable = 5 · sumar: variable = -1 (sin número suma 1)
  iniciar: temporizador = 5 (turnos) · cancelar: temporizador
  puntos: 5 (solo si la puntuación está activa) · puntos: 5 > clave (una sola vez)
  seguir: (además ejecuta el comando normal)

SINO (Si no se cumplen):

Objetos y habitaciones: por nombre o por id. "aqui" = la sala actual.`;

function unlock(q, w = ''){
  let r = R();
  // Detecta la dirección limpia aunque contenga más texto
  let dirTarget = q.split(/\s+/)[0];
  let dq = dirOf(dirTarget), n = 0;
  let ks = inv().filter(i=>fh(i,'llave'));
  
  // Extrae el código numérico ya sea del parámetro 'w' o del propio texto 'q'
  let codeInput = w.trim() || (q.match(/\b(\d+)\b/)?.[1] || '');

  for (let d in r.ex){
    let x = r.ex[d];
    if(!G.rooms[x.to] || (dq && dq != d)) continue;
    
    if(RU.xo(S.room, d)) continue;

    n = 1;
    S.xo = S.xo || {};

    // Caso A: CÓDIGO
    if(x.code){
      if(!codeInput) return out(`La salida «${dn(d)}» exige un código numérico. Usa: abrir ${dn(d)} con <código>.`, 'w');
      if(codeInput == x.code){
        S.unl[S.room+d] = 1;
        S.unl[x.to+OP[d]] = 1;
        S.xo[S.room+d] = 1;
        if(OP[d] && G.rooms[x.to].ex[OP[d]]) S.xo[x.to+OP[d]] = 1;
        return out(`Introduces el código ${codeInput}: el paso hacia el ${dn(d)} se desbloquea.`, 'ok');
      } else {
        return out('El código es incorrecto.', 'w');
      }
    }

    // Caso B: LLAVE
    if(x.lock){
      if(S.unl[S.room+d]){
        S.xo[S.room+d] = 1;
        if(OP[d] && G.rooms[x.to].ex[OP[d]]) S.xo[x.to+OP[d]] = 1;
        return out(`Abres la puerta hacia el ${dn(d)}.`, 'ok');
      }
      let k = ks.find(i => i.master || (i.opens || []).includes(S.room + ':' + d));
      if(k){
        S.unl[S.room+d] = 1;
        S.unl[x.to+OP[d]] = 1;
        S.xo[S.room+d] = 1;
        if(OP[d] && G.rooms[x.to].ex[OP[d]]) S.xo[x.to+OP[d]] = 1;
        out(`Usas ${k.name}: la salida «${dn(d)}» se abre.`, 'ok');
      } else {
        out(`La salida «${dn(d)}» está cerrada con llave y no tienes ninguna que encaje.`, 'w');
      }
      continue;
    }

    // Caso C: Puerta simplemente entornada o cerrada
    S.xo[S.room+d] = 1;
    if(OP[d] && G.rooms[x.to].ex[OP[d]]) S.xo[x.to+OP[d]] = 1;
    out(`Abres el paso hacia el ${dn(d)}.`, 'ok');
  }
  if(!n) out('No hay nada que abrir.');
  upd();
}

function canSee(x){
  if(!x) return false;
  if(S.inv.includes(x.id)) return true; // Si está en el inventario, siempre se ve
  
  let pId = par(x);
  if(!pId) return true; // Si está suelto en la sala (sin padre), se ve
  
  let parent = it(pId);
  if(!parent) return false;
  
  // Si el padre es un contenedor, debe estar abierto
  if(fh(parent, 'contenedor') && !cs(parent).open) return false;
  
  // Si el padre está dentro de otro contenedor, comprueba recursivamente hacia arriba
  return canSee(parent);

function closeCont(x, w, echaLlave){
  let c = cs(x);

  if(fh(x, 'superficie') || x.noClose){
    return out(`${x.name} no se puede cerrar.`, 'w');
  }

  if(!c.open) return out(`${x.name} ya está cerrado.`);

  // CÓDIGO: Se bloquea automáticamente al cerrar
  if(x.cl == 'code'){
    c.open = false;
    c.unl = false;
    return out(`Cierras ${x.name}. El pestillo de combinación salta y se bloquea automáticamente.`, 'ok');
  }

  // LLAVE: Petición explícita de echar llave
  if(x.cl == 'key' && echaLlave){
    let k = inv().filter(i=>fh(i,'llave')).find(i=>(!w||nz(i.name).includes(nz(w)))&&(i.master||(i.opens||[]).includes('i:'+x.id)));
    if(!k) return out(`No tienes ninguna llave que encaje para echar el cerrojo a ${x.name}.`, 'w');
    
    c.open = false;
    c.unl = false;
    return out(`Cierras ${x.name} y usas ${k.name} para echar el cerrojo con llave.`, 'ok');
  }

  // Cierre normal
  c.open = false;
  out(`Cierras ${x.name}.`, 'ok');
}

function cerrarCmd(a){
  let m = a.match(/^(.+?)\s+con\s+(.+)$/), t = m ? m[1] : a, w = m ? m[2] : '';
  let d = dirOf(t);
  let echaLlave = /llave/i.test(w) || !!w;

  // 1. Salidas del mapa
  if(d){
    let r = R();
    let x = r.ex[d];
    if(x && G.rooms[x.to]){
      if(!x.lock && !x.canClose && !x.code){
        return out(`El paso hacia el ${dn(d)} no tiene una puerta o mecanismo para cerrarse.`, 'w');
      }

      S.xo = S.xo || {};

      // Caso A: Puerta con CÓDIGO (se bloquea sola al cerrar)
      if(x.code){
        S.xo[S.room + d] = 0;
        delete S.unl[S.room + d];
        if(OP[d] && G.rooms[x.to].ex[OP[d]]){
          S.xo[x.to + OP[d]] = 0;
          delete S.unl[x.to + OP[d]];
        }
        return out(`Cierras la puerta hacia el ${dn(d)}. El pestillo de combinación se bloquea automáticamente.`, 'ok');
      }

      // Caso B: Puerta con LLAVE
      if(x.lock){
        if(echaLlave){
          let ks = inv().filter(i => fh(i, 'llave'));
          let k = ks.find(i => (!w || nz(i.name).includes(nz(w))) && (i.master || (i.opens || []).includes(S.room + ':' + d)));
          if(!k){
            return out(`No tienes ninguna llave que encaje para echar el cerrojo a la salida «${dn(d)}».`, 'w');
          }
          S.xo[S.room + d] = 0;
          delete S.unl[S.room + d]; // Echa la llave (exigirá llave al abrir)
          if(OP[d] && G.rooms[x.to].ex[OP[d]]){
            S.xo[x.to + OP[d]] = 0;
            delete S.unl[x.to + OP[d]];
          }
          return out(`Cierras el paso hacia el ${dn(d)} y usas ${k.name} para echar el cerrojo.`, 'ok');
        } else {
          // Solo entorna la puerta (sin echar la llave)
          S.xo[S.room + d] = 0;
          if(OP[d] && G.rooms[x.to].ex[OP[d]]){
            S.xo[x.to + OP[d]] = 0;
          }
          return out(`Cierras la puerta hacia el ${dn(d)} (sin echar la llave).`, 'ok');
        }
      }

      // Caso C: Puerta normal
      S.xo[S.room + d] = 0;
      if(OP[d] && G.rooms[x.to].ex[OP[d]]){
        S.xo[x.to + OP[d]] = 0;
      }
      return out(`Cierras el paso hacia el ${dn(d)}.`, 'ok');
    }
    return out(`No hay ninguna salida al ${dn(d)} que puedas cerrar.`, 'w');
  }

  // 2. Objetos contenedores
  if(L() == 'on'){
    let roomItems = RM().items.map(it).filter(Boolean);
    let x = fnd(inv().concat(roomItems), t);
    if(x && fh(x, 'contenedor')) return closeCont(x, w, echaLlave);
    if(x) return out('No se puede cerrar eso.', 'w');
  }
  out('¿Qué quieres cerrar?', 'w');
}

    whenLines.forEach((wLine, idx) => {
      let isSi = /^si\s*:/i.test(wLine);
      let cond = isSi ? wLine.replace(/^si\s*:\s*/i, '') : wLine;

let panX = 0, panY = 0, lastRoom = null;

function map(){
  let cv = $('#map');
  MR = [];
  if(!S || !cv.clientWidth) return;
  
  let W = cv.width = cv.clientWidth, H = cv.height = 190;
  let x = cv.getContext('2d');
  let c0 = G.rooms[S.room];
  if(!c0) return;

  // Recentrado automático cuando el jugador cambia de habitación
  if(lastRoom !== S.room){
    panX = 0;
    panY = 0;
    lastRoom = S.room;
  }

  const lib = G.mapStyle == 'libre';
  const DV = { n:[0,-1], s:[0,1], e:[1,0], o:[-1,0], ne:[1,-1], no:[-1,-1], se:[1,1], so:[-1,1] };
  const GL = { u:'▲', d:'▼', 'in':'⇥', out:'⇤' };
  let pos = {}, bad = [];

  // 1. Matriz de coordenadas
  if(lib){
    Object.keys(S.vis).map(i => G.rooms[i]).filter(Boolean).forEach(r => {
      pos[r.id] = [r.x, r.y];
      for(let d in r.ex){
        let t = G.rooms[r.ex[d].to];
        if(t) pos[t.id] = [t.x, t.y];
      }
    });
  } else {
    let occ = {'0,0': c0.id}, q = [c0.id];
    pos[c0.id] = [0, 0];
    while(q.length){
      let r = G.rooms[q.shift()];
      if(!S.vis[r.id]) continue;
      for(let d in r.ex){
        let t = G.rooms[r.ex[d].to], v = DV[d];
        if(!t || !v) continue;
        let p = [pos[r.id][0] + v[0], pos[r.id][1] + v[1]], k = p + '';
        if(t.id in pos){
          if(pos[t.id] + '' != k) bad.push([r, d]);
          continue;
        }
        if(occ[k]){
          bad.push([r, d]);
          continue;
        }
        pos[t.id] = p;
        occ[k] = t.id;
        q.push(t.id);
      }
    }
  }

  let ps = Object.keys(pos).map(i => G.rooms[i]).filter(Boolean);
  if(!ps.length) return;

  // 2. Escala y centrado (con soporte de arrastre manual)
  let minSc = 52, boxSize = 28;
  let X = ps.map(r => pos[r.id][0]), Y = ps.map(r => pos[r.id][1]);
  let x0 = Math.min(...X), y0 = Math.min(...Y);
  let nx = Math.max(...X) - x0 + 1, ny = Math.max(...Y) - y0 + 1;

  let sc = Math.max(minSc, Math.min(64, Math.min((W - 32) / nx, (H - 32) / ny)));
  let z = Math.min(boxSize, sc - 16);

  let curPos = pos[S.room] || [0, 0];
  let baseOx = (nx * sc <= W - 20) ? (W - sc * nx) / 2 - x0 * sc + sc / 2 : W / 2 - curPos[0] * sc;
  let baseOy = (ny * sc <= H - 20) ? (H - sc * ny) / 2 - y0 * sc + sc / 2 : H / 2 - curPos[1] * sc;

  let ox = baseOx + panX;
  let oy = baseOy + panY;

  let P = r => [ox + pos[r.id][0] * sc, oy + pos[r.id][1] * sc];
  let dn = new Set();

  x.clearRect(0, 0, W, H);

  const getAnchor = (cx, cy, size, dir) => {
    let h = size / 2;
    switch(dir){
      case 'n':  return [cx, cy - h];
      case 's':  return [cx, cy + h];
      case 'e':  return [cx + h, cy];
      case 'o':  return [cx - h, cy];
      case 'ne': return [cx + h, cy - h];
      case 'no': return [cx - h, cy - h];
      case 'se': return [cx + h, cy + h];
      case 'so': return [cx - h, cy + h];
      default:   return [cx, cy];
    }
  };

  const drawArrow = (tx, ty, angle, color) => {
    let L = 5;
    x.fillStyle = color;
    x.beginPath();
    x.moveTo(tx, ty);
    x.lineTo(tx - Math.cos(angle - 0.45) * L, ty - Math.sin(angle - 0.45) * L);
    x.lineTo(tx - Math.cos(angle + 0.45) * L, ty - Math.sin(angle + 0.45) * L);
    x.closePath();
    x.fill();
  };

    // Comprueba si un segmento atraviesa alguna sala distinta de origen/destino
  const hitsRoom = (p, q, r, t) => ps.some(o => {
    if(o.id == r.id || o.id == t.id) return false;
    let [qx, qy] = P(o), m = z / 2 + 3;
    return Math.max(p[0], q[0]) > qx - m && Math.min(p[0], q[0]) < qx + m &&
           Math.max(p[1], q[1]) > qy - m && Math.min(p[1], q[1]) < qy + m;
  });

  // Devuelve la lista de puntos del camino (rectas + una sola curva en L)
  const route = (r, t, d, a, b, c, e) => {
    const h = z / 2;
    const [x1, y1] = getAnchor(a, b, z, d);
    const sx = Math.sign(c - x1), sy = Math.sign(e - y1);

    // Vertical primero: baja/sube hasta la altura del destino y entonces gira
    const V = () => Math.abs(c - x1) < 4
      ? [[x1, y1], [x1, e - sy * h]]
      : [[x1, y1], [x1, e], [c - sx * h, e]];

    // Horizontal primero: avanza hasta la columna del destino y entonces gira
    const H = () => Math.abs(e - y1) < 4
      ? [[x1, y1], [c - sx * h, y1]]
      : [[x1, y1], [c, y1], [c, e - sy * h]];

    const vertFirst = (d == 'n' || d == 's' || d.length == 2);
    const cands = vertFirst ? [V(), H()] : [H(), V()];

    for(const pts of cands){
      let ok = true;
      for(let i = 0; i < pts.length - 1 && ok; i++){
        if(hitsRoom(pts[i], pts[i + 1], r, t)) ok = false;
      }
      if(ok) return pts;
    }
    return cands[0]; // si todas chocan, usa la preferida
  };

  // PASO A: DIBUJAR LÍNEAS LIMPIAS Y UNIFICADAS
  x.lineWidth = 1.5;

  ps.forEach(r => {
    if(!S.vis[r.id]) return;
    let [a, b] = P(r);

    for(let d in r.ex){
      let t = G.rooms[r.ex[d].to];
      if(!t || !pos[t.id]) continue;

      // Clave estricta de deduplicación (evita duplicar líneas de ida y vuelta)
      let k = [r.id, t.id].sort().join('-');
      if(dn.has(k)) continue;
      dn.add(k);

      let [c, e] = P(t);
      if(Math.max(a, c) < -60 || Math.min(a, c) > W + 60 || Math.max(b, e) < -60 || Math.min(b, e) > H + 60) continue;

      // Autoconexión
      if(t.id == r.id){
        let [sx, sy] = getAnchor(a, b, z, d);
        let lp = 12;
        let dx = d=='e'? lp : d=='o'? -lp : 0;
        let dy = d=='s'? lp : d=='n'? -lp : -lp;
        x.strokeStyle = '#5a6788';
        x.beginPath();
        x.moveTo(sx, sy);
        x.lineTo(sx + dx, sy + dy);
        x.lineTo(sx + dx + (dx?0:lp), sy + dy + (dy?0:lp));
        x.lineTo(a + (dx?dx:lp/2), b + (dy?dy:lp/2));
        x.stroke();
        continue;
      }

      let vs = S.vis[t.id];
      let lineCol = vs ? '#6c82b0' : '#3d4860';
      x.strokeStyle = lineCol;
      x.setLineDash(vs ? [] : [3, 3]);

            let x1, y1, x2, y2, arrAngle;
      x.beginPath();

      if(DV[d]){
        // Salidas de brújula: recta + una sola L, sin atravesar otras salas
        let pts = route(r, t, d, a, b, c, e);
        pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1]));
        [x1, y1] = pts[0];
        [x2, y2] = pts[pts.length - 1];
        let pv = pts[pts.length - 2];
        arrAngle = Math.atan2(y2 - pv[1], x2 - pv[0]);
      } else {
        // Subir/bajar/entrar/salir: se mantiene el comportamiento anterior
        [x1, y1] = getAnchor(a, b, z, d);
        [x2, y2] = getAnchor(c, e, z, OP && OP[d] ? OP[d] : d);
        let midY = (y1 + y2) / 2;
        x.moveTo(x1, y1);
        if(Math.abs(x1 - x2) < 4 || Math.abs(y1 - y2) < 4){
          x.lineTo(x2, y2);
          arrAngle = Math.atan2(y2 - y1, x2 - x1);
        } else {
          x.lineTo(x1, midY);
          x.lineTo(x2, midY);
          x.lineTo(x2, y2);
          arrAngle = Math.atan2(y2 - midY, 0);
        }
      }
      x.stroke();
      x.setLineDash([]);

      // Flecha de sentido único
      let isTwoWay = Object.values(t.ex).some(y => y.to == r.id);
      if(!isTwoWay){
        drawArrow(x2, y2, arrAngle, lineCol);
      }
      // Símbolos de nivel o puerta cerrada
      let dist = Math.hypot(x2 - x1, y2 - y1);
      if((d == 'u' || d == 'd' || d == 'in' || d == 'out') && dist > 18){
        let mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
        x.fillStyle = '#171a22';
        x.fillRect(mx - 6, my - 6, 12, 12);
        x.strokeStyle = '#5a6d9c';
        x.strokeRect(mx - 6, my - 6, 12, 12);
        x.fillStyle = '#d8dce6';
        x.font = 'bold 8px system-ui';
        x.textAlign = 'center';
        x.textBaseline = 'middle';
        x.fillText(GL[d] || d[0].toUpperCase(), mx, my);
      }
    }
  });

  // PASO B: DIBUJAR CASILLAS ENCIMA (OCULTAN CUALQUIER TRAZO SUBYACENTE)
  ps.forEach(r => {
    let [a, b] = P(r);
    if(a < -40 || a > W + 40 || b < -40 || b > H + 40) return;

    let v = S.vis[r.id];
    let cu = (r.id == S.room);

    MR.push({ a, b, z, n: v ? r.name : 'Sin explorar' });

    x.save();
    let h = z / 2;

    if(cu){
      x.shadowColor = '#e0a84a';
      x.shadowBlur = 8;
      x.fillStyle = '#e0a84a';
      x.strokeStyle = '#ffffff';
      x.lineWidth = 2;
    } else if(v){
      x.fillStyle = '#1b2333';
      x.strokeStyle = '#4f618a';
      x.lineWidth = 1.2;
    } else {
      x.fillStyle = '#12151e';
      x.strokeStyle = '#2d374d';
      x.setLineDash([2, 2]);
      x.lineWidth = 1;
    }

    x.beginPath();
    if(x.roundRect) x.roundRect(a - h, b - h, z, z, 4);
    else x.rect(a - h, b - h, z, z);
    x.fill();
    x.stroke();
    x.restore();

    x.textAlign = 'center';
    x.textBaseline = 'middle';

    if(!v){
      x.fillStyle = '#5c677d';
      x.font = 'bold 11px system-ui';
      x.fillText('?', a, b);
    } else {
      x.fillStyle = cu ? '#0e1015' : '#d8dce6';
      x.font = (cu ? 'bold ' : '') + '9px system-ui';
      let words = r.name.trim().split(/\s+/);
      let label = words.length > 1 ? words.map(w => w[0]).join('').slice(0, 3).toUpperCase() : r.name.slice(0, 3).toUpperCase();
      x.fillText(label, a, b);
    }
  });
}

let MR = [];
const tip = $('#tip') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'tip' }));

let isMouseDown = false, startX = 0, startY = 0, startPanX = 0, startPanY = 0;
let cvMap = $('#map');

cvMap.style.cursor = 'grab';

cvMap.onmousedown = e => {
  isMouseDown = true;
  startX = e.clientX;
  startY = e.clientY;
  startPanX = panX;
  startPanY = panY;
  cvMap.style.cursor = 'grabbing';
};

window.addEventListener('mousemove', e => {
  if (isMouseDown) {
    let dx = e.clientX - startX;
    let dy = e.clientY - startY;
    panX = startPanX + dx;
    panY = startPanY + dy;
    map();
    if (tip) tip.style.display = 'none';
    return;
  }

  let b = cvMap.getBoundingClientRect();
  let px = e.clientX - b.left;
  let py = e.clientY - b.top;
  
  let h = MR.find(m => Math.abs(px - m.a) <= m.z / 2 + 4 && Math.abs(py - m.b) <= m.z / 2 + 4);
  
  if(h){
    tip.textContent = h.n;
    tip.style.cssText = `display:block;position:fixed;left:${Math.min(e.clientX + 12, innerWidth - 180)}px;top:${e.clientY + 14}px;background:#000d;border:1px solid var(--a);padding:4px 9px;border-radius:6px;z-index:99;pointer-events:none;font-size:13px;color:#fff;box-shadow:0 2px 8px #0008;`;
  } else {
    tip.style.display = 'none';
  }
});

window.addEventListener('mouseup', () => {
  if (isMouseDown) {
    isMouseDown = false;
    cvMap.style.cursor = 'grab';
  }
});

cvMap.onmouseleave = () => {
  if (tip) tip.style.display = 'none';
};
