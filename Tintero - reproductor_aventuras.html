function canSee(x){
  if(!x) return false;
  if(S.inv.includes(x.id)) return true; // Si está en el inventario, siempre se ve
  
  let pId = par(x);
  if(!pId) return true; // Si está suelto en la sala (sin padre), se ve
  
  let parent = it(pId);
  if(!parent) return false;
  
  // Si el padre es un contenedor, debe estar abierto

  return canSee(parent);
}

function cerrarCmd(a){
  let m = a.match(/^(.+?)\s+con\s+(.+)$/), t = m ? m[1] : a, w = m ? m[2] : '';

  let echaLlave = /llave/i.test(w) || !!w;

  // 1. Salidas del mapa
  if(d){
    let r = R();

    if(x && G.rooms[x.to]){
      if(!x.lock && !x.canClose && !x.code){
        return out(`El paso hacia el ${dn(d)} no tiene una puerta o mecanismo para cerrarse.`, 'w');
      }

      S.xo = S.xo || {};

      // Caso A: Puerta con CÓDIGO (se bloquea sola al cerrar)
      if(x.code){
        S.xo[S.room + d] = 0;
        delete S.unl[S.room + d];
        if(OP[d] && G.rooms[x.to].ex[OP[d]]){
          S.xo[x.to + OP[d]] = 0;
          delete S.unl[x.to + OP[d]];
        }
        return out(`Cierras la puerta hacia el ${dn(d)}. El pestillo de combinación se bloquea automáticamente.`, 'ok');
      }

      // Caso B: Puerta con LLAVE
      if(x.lock){
        if(echaLlave){
          let ks = inv().filter(i => fh(i, 'llave'));
          let k = ks.find(i => (!w || nz(i.name).includes(nz(w))) && (i.master || (i.opens || []).includes(S.room + ':' + d)));

          }

          delete S.unl[S.room + d]; // Echa la llave (exigirá llave al abrir)
          if(OP[d] && G.rooms[x.to].ex[OP[d]]){
            S.xo[x.to + OP[d]] = 0;
            delete S.unl[x.to + OP[d]];
          }
          return out(`Cierras el paso hacia el ${dn(d)} y usas ${k.name} para echar el cerrojo.`, 'ok');
        } else {
          // Solo entorna la puerta (sin echar la llave)
          S.xo[S.room + d] = 0;
          if(OP[d] && G.rooms[x.to].ex[OP[d]]){
            S.xo[x.to + OP[d]] = 0;
          }
          return out(`Cierras la puerta hacia el ${dn(d)} (sin echar la llave).`, 'ok');
        }
      }

      // Caso C: Puerta normal
      S.xo[S.room + d] = 0;
      if(OP[d] && G.rooms[x.to].ex[OP[d]]){
        S.xo[x.to + OP[d]] = 0;
      }

    }

  if(L() == 'on'){

}

    Object.keys(S.vis).map(i => G.rooms[i]).filter(Boolean).forEach(r => {
      pos[r.id] = [r.x, r.y];
      for(let d in r.ex){
        let t = G.rooms[r.ex[d].to];
        if(t) pos[t.id] = [t.x, t.y];
      }
    });
  } else {
    let occ = {'0,0': c0.id}, q = [c0.id];
    pos[c0.id] = [0, 0];
    while(q.length){
      let r = G.rooms[q.shift()];
      if(!S.vis[r.id]) continue;
      for(let d in r.ex){
        let t = G.rooms[r.ex[d].to], v = DV[d];
        if(!t || !v) continue;
        let p = [pos[r.id][0] + v[0], pos[r.id][1] + v[1]], k = p + '';
        if(t.id in pos){
          if(pos[t.id] + '' != k) bad.push([r, d]);
          continue;
        }
        if(occ[k]){ bad.push([r, d]); continue; }
        pos[t.id] = p;
        occ[k] = t.id;
        q.push(t.id);
      }
    }
  }

  let ps = Object.keys(pos).map(i => G.rooms[i]).filter(Boolean);
  if(!ps.length) return;

  let minSc = 52, boxSize = 28;
  let X = ps.map(r => pos[r.id][0]), Y = ps.map(r => pos[r.id][1]);
  let x0 = Math.min(...X), y0 = Math.min(...Y);
  let nx = Math.max(...X) - x0 + 1, ny = Math.max(...Y) - y0 + 1;

  let sc = Math.max(minSc, Math.min(64, Math.min((W - 32) / nx, (H - 32) / ny)));
  let z = Math.min(boxSize, sc - 16);

  let curPos = pos[S.room] || [0, 0];
  let baseOx = (nx * sc <= W - 20) ? (W - sc * nx) / 2 - x0 * sc + sc / 2 : W / 2 - curPos[0] * sc;
  let baseOy = (ny * sc <= H - 20) ? (H - sc * ny) / 2 - y0 * sc + sc / 2 : H / 2 - curPos[1] * sc;

  let ox = baseOx + panX;
  let oy = baseOy + panY;

  let P = r => [ox + pos[r.id][0] * sc, oy + pos[r.id][1] * sc];
  let dn = new Set();

  x.clearRect(0, 0, W, H);

  const getAnchor = (cx, cy, size, dir) => {
    let h = size / 2;
    switch(dir){
      case 'n':  return [cx, cy - h];
      case 's':  return [cx, cy + h];
      case 'e':  return [cx + h, cy];
      case 'o':  return [cx - h, cy];
      case 'ne': return [cx + h, cy - h];
      case 'no': return [cx - h, cy - h];
      case 'se': return [cx + h, cy + h];
      case 'so': return [cx - h, cy + h];
      default:   return [cx, cy];
    }
  };

  const drawArrow = (tx, ty, angle, color) => {
    let L = 5;
    x.fillStyle = color;
    x.beginPath();
    x.moveTo(tx, ty);
    x.lineTo(tx - Math.cos(angle - 0.45) * L, ty - Math.sin(angle - 0.45) * L);
    x.lineTo(tx - Math.cos(angle + 0.45) * L, ty - Math.sin(angle + 0.45) * L);
    x.closePath();
    x.fill();
  };

  const hitsRoom = (p, q, r, t) => ps.some(o => {
    if(o.id == r.id || o.id == t.id) return false;
    let [qx, qy] = P(o), m = z / 2 + 3;
    return Math.max(p[0], q[0]) > qx - m && Math.min(p[0], q[0]) < qx + m &&
           Math.max(p[1], q[1]) > qy - m && Math.min(p[1], q[1]) < qy + m;
  });

  const route = (r, t, d, a, b, c, e) => {
    const h = z / 2;
    const [x1, y1] = getAnchor(a, b, z, d);
    const sx = Math.sign(c - x1), sy = Math.sign(e - y1);
    const V = () => Math.abs(c - x1) < 4 ? [[x1, y1], [x1, e - sy * h]] : [[x1, y1], [x1, e], [c - sx * h, e]];
    const H = () => Math.abs(e - y1) < 4 ? [[x1, y1], [c - sx * h, y1]] : [[x1, y1], [c, y1], [c, e - sy * h]];
    const vertFirst = (d == 'n' || d == 's' || d.length == 2);
    const cands = vertFirst ? [V(), H()] : [H(), V()];
    for(const pts of cands){
      let ok = true;
      for(let i = 0; i < pts.length - 1 && ok; i++){
        if(hitsRoom(pts[i], pts[i + 1], r, t)) ok = false;
      }
      if(ok) return pts;
    }
    return cands[0];
  };

  x.lineWidth = 1.5;

  ps.forEach(r => {
    if(!S.vis[r.id]) return;
    let [a, b] = P(r);

    for(let d in r.ex){
      let t = G.rooms[r.ex[d].to];
      if(!t || !pos[t.id]) continue;

      let k = [r.id, t.id].sort().join('-');
      if(dn.has(k)) continue;
      dn.add(k);

      let [c, e] = P(t);
      if(Math.max(a, c) < -60 || Math.min(a, c) > W + 60 || Math.max(b, e) < -60 || Math.min(b, e) > H + 60) continue;

      if(t.id == r.id){
        let [sx, sy] = getAnchor(a, b, z, d);
        let lp = 12;
        let dx = d=='e'? lp : d=='o'? -lp : 0;
        let dy = d=='s'? lp : d=='n'? -lp : -lp;
        x.strokeStyle = '#5a6788';
        x.beginPath();
        x.moveTo(sx, sy);
        x.lineTo(sx + dx, sy + dy);
        x.lineTo(sx + dx + (dx?0:lp), sy + dy + (dy?0:lp));
        x.lineTo(a + (dx?dx:lp/2), b + (dy?dy:lp/2));
        x.stroke();
        continue;
      }

      let vs = S.vis[t.id];
      let lineCol = vs ? '#6c82b0' : '#3d4860';
      x.strokeStyle = lineCol;
      x.setLineDash(vs ? [] : [3, 3]);

      let x1, y1, x2, y2, arrAngle;
      x.beginPath();

      if(DV[d]){
        let pts = route(r, t, d, a, b, c, e);
        pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1]));
        [x1, y1] = pts[0];
        [x2, y2] = pts[pts.length - 1];
        let pv = pts[pts.length - 2];
        arrAngle = Math.atan2(y2 - pv[1], x2 - pv[0]);
      } else {
        [x1, y1] = getAnchor(a, b, z, d);
        [x2, y2] = getAnchor(c, e, z, OP && OP[d] ? OP[d] : d);
        let midY = (y1 + y2) / 2;
        x.moveTo(x1, y1);
        if(Math.abs(x1 - x2) < 4 || Math.abs(y1 - y2) < 4){
          x.lineTo(x2, y2);
          arrAngle = Math.atan2(y2 - y1, x2 - x1);
        } else {
          x.lineTo(x1, midY);
          x.lineTo(x2, midY);
          x.lineTo(x2, y2);
          arrAngle = Math.atan2(y2 - midY, 0);
        }
      }
      x.stroke();
      x.setLineDash([]);

      let isTwoWay = Object.values(t.ex).some(y => y.to == r.id);
      if(!isTwoWay){
        drawArrow(x2, y2, arrAngle, lineCol);
      }
      let dist = Math.hypot(x2 - x1, y2 - y1);
      if((d == 'u' || d == 'd' || d == 'in' || d == 'out') && dist > 18){
        let mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
        x.fillStyle = '#171a22';
        x.fillRect(mx - 6, my - 6, 12, 12);
        x.strokeStyle = '#5a6d9c';
        x.strokeRect(mx - 6, my - 6, 12, 12);
        x.fillStyle = '#d8dce6';
        x.font = 'bold 8px system-ui';
        x.textAlign = 'center';
        x.textBaseline = 'middle';
        x.fillText(GL[d] || d[0].toUpperCase(), mx, my);
      }
    }
  });

  ps.forEach(r => {
    let [a, b] = P(r);
    if(a < -40 || a > W + 40 || b < -40 || b > H + 40) return;

    let v = S.vis[r.id];
    let cu = (r.id == S.room);

    MR.push({ a, b, z, n: v ? r.name : 'Sin explorar' });

    x.save();
    let h = z / 2;

    if(cu){
      x.shadowColor = '#e0a84a';
      x.shadowBlur = 8;
      x.fillStyle = '#e0a84a';
      x.strokeStyle = '#ffffff';
      x.lineWidth = 2;
    } else if(v){
      x.fillStyle = '#1b2333';
      x.strokeStyle = '#4f618a';
      x.lineWidth = 1.2;
    } else {
      x.fillStyle = '#12151e';
      x.strokeStyle = '#2d374d';
      x.setLineDash([2, 2]);
      x.lineWidth = 1;
    }

    x.beginPath();
    if(x.roundRect) x.roundRect(a - h, b - h, z, z, 4);
    else x.rect(a - h, b - h, z, z);
    x.fill();
    x.stroke();
    x.restore();

    x.textAlign = 'center';
    x.textBaseline = 'middle';

    if(!v){
      x.fillStyle = '#5c677d';
      x.font = 'bold 11px system-ui';
      x.fillText('?', a, b);
    } else {
      x.fillStyle = cu ? '#0e1015' : '#d8dce6';
      x.font = (cu ? 'bold ' : '') + '9px system-ui';
      let words = r.name.trim().split(/\s+/);
      let label = words.length > 1 ? words.map(w => w[0]).join('').slice(0, 3).toUpperCase() : r.name.slice(0, 3).toUpperCase();
      x.fillText(label, a, b);
    }
  });
}

let MR = [];
const tip = $('#tip') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'tip' }));

let isMouseDown = false, startX = 0, startY = 0, startPanX = 0, startPanY = 0;
let cvMap = $('#map');

cvMap.style.cursor = 'grab';

cvMap.onmousedown = e => {
  isMouseDown = true;
  startX = e.clientX;
  startY = e.clientY;
  startPanX = panX;
  startPanY = panY;
  cvMap.style.cursor = 'grabbing';
};

window.addEventListener('mousemove', e => {
  if (isMouseDown) {
    let dx = e.clientX - startX;
    let dy = e.clientY - startY;
    panX = startPanX + dx;
    panY = startPanY + dy;
    map();
    if (tip) tip.style.display = 'none';
    return;
  }

  let b = cvMap.getBoundingClientRect();
  let px = e.clientX - b.left;
  let py = e.clientY - b.top;
  
  let h = MR.find(m => Math.abs(px - m.a) <= m.z / 2 + 4 && Math.abs(py - m.b) <= m.z / 2 + 4);
  
  if(h){
    tip.textContent = h.n;
    tip.style.cssText = `display:block;position:fixed;left:${Math.min(e.clientX + 12, innerWidth - 180)}px;top:${e.clientY + 14}px;background:#000d;border:1px solid var(--a);padding:4px 9px;border-radius:6px;z-index:99;pointer-events:none;font-size:13px;color:#fff;box-shadow:0 2px 8px #0008;`;
  } else {
    tip.style.display = 'none';
  }
});

window.addEventListener('mouseup', () => {
  if (isMouseDown) {
    isMouseDown = false;
    cvMap.style.cursor = 'grab';
  }
});

cvMap.onmouseleave = () => {
  if (tip) tip.style.display = 'none';
};

// Vinculación de envío de comandos (Enviar / Enter)
const send=()=>{exec($('#in').value);$('#in').value=''};
$('#send').onclick=send;
$('#in').onkeydown=e=>{if(e.key=='Enter')send()};

const dl=(o,n)=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));a.download=n;a.click()};

function begin(){$('#menu').classList.remove('o');if(!G)return add('Carga una aventura primero (☰ → Cargar aventura).','w');start()}
$('#ng').onclick=$('#ng2').onclick=begin;
$('#xg').onclick=()=>S?dl({tipo:'partida',project_id:G.project_id,G,S},'partida-aventura.gma'):UI.alert('Inicia una partida primero.');
$('#ld').onclick=()=>$('#fi').click();

$('#fi').onchange=e=>{
  let f=e.target.files[0];
  e.target.value='';
  if(!f)return;
  let fr=new FileReader();
  fr.onload=()=>{
    try{
      let j=JSON.parse(fr.result);
      let cr=$('#cr');
      $('#menu').classList.remove('o');
      if(j.tipo=='partida'){
        let id=j.project_id||(j.G&&j.G.project_id);
        if(G&&id&&id!=G.project_id)return UI.alert('Esta partida pertenece a otro juego y no es compatible');
        if(!G&&j.G)G=fix(j.G);
        if(!G||!j.S||!G.rooms[j.S.room])throw 0;
        sv();
        cr&&(cr.style.display='none');
        $('#ttl').textContent=G.title;
        S=j.S;
        S.slot=uidS();
        $('#log').innerHTML='';
        S.log.forEach(l=>add(l[0],l[1]));
        upd();
        asv();
      }else{
        let projData = j.G || (j.rooms ? j : null);
        if(!projData) throw 0;
        projData.project_id = projData.project_id || j.project_id;
        G=fix(projData);
        sv();
        $('#ttl').textContent=G.title;
        start();
      }
    }catch(x){
      UI.alert('Archivo no válido: usa un archivo .ma, .gma o .json exportado desde el editor.');
    }
  };
  fr.readAsText(f);
};

try{
  let saved = localStorage.getItem('mat_play');
  if(saved) G=fix(JSON.parse(saved));
}catch(e){G=null}

const fixClones=()=>{
  if(!S||!S.inv) return;
  S.clones = S.clones || {};
  S.inv.forEach(id=>{
    if(!S.clones[id] && !G.items[id] && id.includes('_inv_')){
      let baseId = id.split('_inv_')[0];
      if(G.items[baseId]){
        S.clones[id] = mk(IDF, { ...G.items[baseId], id: id, start: false, into: '', on: '', under: '' });
      }
    }
  });
};

const load=x=>{
  S=JSON.parse(JSON.stringify(x.S));
  fixClones();
  $('#log').innerHTML='';
  S.log.forEach(l=>add(l[0],l[1]));
  upd();
};

$('#ses').onclick=e=>{
  let b=e.target.closest('[data-sa]');
  if(!b)return;
  let a=b.dataset.sa,id=b.dataset.id,l=slots();
  if(a=='cont'){if(l[0])load(l[0])}
  else if(a=='load'){let x=l.find(x=>x.id==id);x?load(x):UI.alert('No se pudo restaurar la partida.')}
  else if(a=='ren'){let r=raw(),x=r.find(x=>x.id==id);if(x)UI.prompt('Nombre de la partida:',x.name).then(n=>{if(n&&n.trim()){x.name=n.trim().slice(0,40);put(r);ses()}})}
  else if(a=='del')UI.confirm('¿Borrar esta partida guardada? La configuración del proyecto no se verá afectada.').then(ok=>{
    if(!ok)return;
    put(raw().filter(x=>x.id!=id));
    if(S&&S.slot==id){
      S=null;
      $('#log').innerHTML='';
      $('#bars').innerHTML='';
      let c=$('#map');
      c.getContext('2d').clearRect(0,0,c.width,c.height);
      add('Partida borrada. Carga otra desde ☰ o pulsa ↺ Nueva partida.','w');
      $('#menu').classList.remove('o');
    }
    ses();
  });
};

if(G){
  $('#ttl').textContent=G.title;
  if(hasSave()) add('Este proyecto tiene partidas guardadas. Abre ☰ para continuar o cargar una, o pulsa ↺ Nueva partida.','k');
  else start();
} else {
  add('Bienvenido. Abre el menú ☰ → "Cargar aventura" y elige un .json exportado desde el editor (proyecto o partida guardada).','k');
}

$('main').onclick = () =>$('#menu').classList.remove('o');
